name: QA CI

# Layered gating (see docs/strategy-and-recommendations.md):
#   - API tests run on every push (fast, headless, no browser)
#   - UI tests run on PRs and nightly (needs Chrome)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run API tests
        env:
          USER_ID: ${{ secrets.USER_ID || 'candidate-pGM9TBT3AEsq' }}
        run: pytest -m api -ra

  ui-tests:
    # UI journey only on PRs and the nightly schedule to keep push feedback fast.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run UI tests (headless)
        env:
          HEADLESS: "true"
          USER_ID: ${{ secrets.USER_ID || 'candidate-pGM9TBT3AEsq' }}
        run: pytest -m ui -ra
